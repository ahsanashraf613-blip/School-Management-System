<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkoolyPro — Iqra Model School (HTML Edition)</title>
<style>
/* ── Design tokens (mirror of the Next.js app emerald theme) ─────────────── */
:root{
  --bg:#f4f8f6; --fg:#182722; --card:#ffffff; --card-fg:#182722;
  --muted:#eef4f0; --muted-fg:#66796f;
  --border:#dfe9e3; --input:#d6e2da;
  --primary:#0e8a66; --primary-h:#0c7557; --primary-fg:#f2fbf7;
  --accent:#e2f2ea; --accent-fg:#175244;
  --danger:#d64545; --warn:#a97a10; --info:#3d7fd9;
  --gold:#d9a514; --chart3:#3d7fd9; --chart4:#e0603c; --chart5:#8f5fd1;
  --sidebar1:#24463f; --sidebar2:#1b3833; --sidebar3:#163029;
  --sb-fg:#e6f1ec; --sb-muted:#9db8ae; --sb-active:#2f5a50;
  --radius:14px;
  --shadow:0 1px 2px rgba(23,42,35,.05),0 1px 3px rgba(23,42,35,.06);
  --shadow-lg:0 8px 24px -8px rgba(23,42,35,.22);
}
html.dark{
  --bg:#121f1a; --fg:#e7f1ec; --card:#1a2b25; --card-fg:#e7f1ec;
  --muted:#20332c; --muted-fg:#8aa396;
  --border:rgba(255,255,255,.09); --input:rgba(255,255,255,.16);
  --primary:#27a87f; --primary-h:#2cbd8f; --primary-fg:#0b1a15;
  --accent:#1f3a30; --accent-fg:#a8d8c4;
  --danger:#e06a6a; --warn:#d9a514;
  --sidebar1:#1b2e28; --sidebar2:#172822; --sidebar3:#13211c;
  --sb-fg:#dcebe4; --sb-muted:#7e998c; --sb-active:#26453a;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 8px 24px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--fg);font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
::selection{background:rgba(14,138,102,.25)}
a{color:inherit;text-decoration:none}
svg{flex-shrink:0}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
aside.sidebar{position:fixed;inset:0 auto 0 0;width:264px;z-index:60;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--sidebar1) 0%,var(--sidebar2) 45%,var(--sidebar3) 100%);
  color:var(--sb-fg);transition:transform .28s cubic-bezier(.22,1,.36,1)}
main{flex:1;margin-left:264px;min-width:0;display:flex;flex-direction:column}
.sb-logo{display:flex;align-items:center;gap:11px;padding:18px 20px 14px}
.sb-logo .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,#0e8a66,#0b6b52);color:#eafff5;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sb-logo b{font-size:16px;letter-spacing:.2px;display:block;line-height:1.2}
.sb-logo span{font-size:11px;color:var(--sb-muted)}
.sb-nav{flex:1;overflow-y:auto;padding:4px 12px 12px}
.sb-group{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sb-muted);padding:14px 10px 5px}
.sb-nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;
  color:var(--sb-fg);font-weight:500;font-size:13.5px;margin-bottom:2px;
  transition:background .15s,color .15s;border:1px solid transparent}
.sb-nav a:hover{background:rgba(255,255,255,.06)}
.sb-nav a.active{background:var(--sb-active);border-color:rgba(255,255,255,.12);
  box-shadow:inset 3px 0 0 #35b98d}
.sb-nav a svg{opacity:.85}
.sb-foot{padding:13px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--sb-muted)}

/* ── Topbar ──────────────────────────────────────────────────────────────── */
.topbar{position:sticky;top:0;z-index:40;height:62px;display:flex;align-items:center;gap:14px;
  padding:0 22px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.topbar h1{font-size:16px;margin:0;font-weight:650}
.topbar .sub{font-size:11.5px;color:var(--muted-fg);margin-top:1px}
.topbar .spacer{flex:1}
.chip-date{font-size:12px;color:var(--muted-fg);border:1px solid var(--border);
  background:var(--card);border-radius:999px;padding:5px 12px;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);
  color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:all .15s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.hamburger{display:none}
.me-badge{width:36px;height:36px;border-radius:999px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;border:1px solid var(--border)}

/* ── View container ──────────────────────────────────────────────────────── */
#view{padding:22px;max-width:1180px;width:100%;margin:0 auto}
.view-enter{animation:viewEnter .35s cubic-bezier(.22,1,.36,1) both}
@keyframes viewEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Cards ───────────────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.card-hover{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:rgba(14,138,102,.4)}
.card-h{padding:14px 18px 4px;font-weight:650;font-size:14.5px}
.card-sub{padding:0 18px 8px;font-size:12.5px;color:var(--muted-fg)}
.card-b{padding:12px 18px 18px}

/* ── Hero banner ─────────────────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 26px 24px;color:#f0fdf8;
  border:1px solid rgba(14,138,102,.25);box-shadow:var(--shadow);
  background:
    radial-gradient(ellipse 60% 90% at 85% -10%,rgba(94,214,170,.35),transparent 60%),
    radial-gradient(ellipse 45% 70% at 5% 110%,rgba(38,166,131,.4),transparent 65%),
    linear-gradient(120deg,#0d7c5e,#0e8a66 55%,#0b6b52)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.13) 1px,transparent 1px);background-size:22px 22px;
  mask-image:linear-gradient(to bottom,transparent,#000 40%,transparent)}
.hero h2{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}
.hero p{margin:0;font-size:13.5px;opacity:.92}
.hero .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.hero .tag{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:4px 12px;font-size:12px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:999px;background:#5effc4;
  margin-right:7px;vertical-align:1px;animation:pulseRing 2s ease-out infinite}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(94,255,196,.5)}70%{box-shadow:0 0 0 7px rgba(94,255,196,0)}
  100%{box-shadow:0 0 0 0 rgba(94,255,196,0)}}

/* ── Stat cards ──────────────────────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.stat{position:relative;overflow:hidden;padding:18px}
.stat .ico{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;background:var(--accent);color:var(--primary)}
.stat .lbl{font-size:12.5px;font-weight:600;color:var(--muted-fg)}
.stat .val{font-size:24px;font-weight:750;letter-spacing:-.02em;margin-top:5px}
.stat .foot{font-size:11.5px;color:var(--muted-fg);margin-top:3px}
.stat .foot b{color:var(--primary)}

/* ── Charts & grids ──────────────────────────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.grid-3-2{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:18px;height:200px;padding-top:10px}
.bar-g{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-pair{display:flex;align-items:flex-end;gap:4px;height:100%;width:70%}
.bar{flex:1;border-radius:6px 6px 2px 2px;min-height:3px;transition:height .6s cubic-bezier(.22,1,.36,1)}
.bar.c{background:linear-gradient(180deg,#17a37c,#0e8a66)}
.bar.p{background:linear-gradient(180deg,#eec25c,#d9a514)}
.bar-lbl{font-size:10.5px;color:var(--muted-fg);white-space:nowrap}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted-fg);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.hbar-name{width:64px;font-size:12.5px;color:var(--muted-fg)}
.hbar-track{flex:1;height:9px;border-radius:999px;background:var(--muted);overflow:hidden}
.hbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#17a37c,#0e8a66);transition:width .6s ease}
.hbar-val{width:30px;text-align:right;font-size:12px;font-weight:600}

/* ── Tables ──────────────────────────────────────────────────────────────── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted-fg);padding:11px 14px;border-bottom:1px solid var(--border);background:var(--muted);
  white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.who{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;font-weight:700;
  font-size:12px;color:#fff;flex-shrink:0}
.who .nm{font-weight:600;line-height:1.25}
.who .sub{font-size:11.5px;color:var(--muted-fg)}

/* ── Chips / badges ──────────────────────────────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;
  font-size:11.5px;font-weight:650;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:rgba(14,138,102,.12);color:var(--primary);border-color:rgba(14,138,102,.25)}
.chip.warn{background:rgba(217,165,20,.14);color:var(--warn);border-color:rgba(217,165,20,.3)}
.chip.bad{background:rgba(214,69,69,.12);color:var(--danger);border-color:rgba(214,69,69,.25)}
.chip.info{background:rgba(61,127,217,.12);color:var(--info);border-color:rgba(61,127,217,.25)}
.chip.mut{background:var(--muted);color:var(--muted-fg);border-color:var(--border)}
.chip.acc{background:var(--accent);color:var(--accent-fg);border-color:rgba(14,138,102,.2)}
.grade{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:7px;font-weight:750;font-size:12px}
.grade.a{background:rgba(14,138,102,.14);color:var(--primary)}
.grade.b{background:rgba(61,127,217,.14);color:var(--info)}
.grade.c{background:rgba(217,165,20,.16);color:var(--warn)}
.grade.f{background:rgba(214,69,69,.13);color:var(--danger)}

/* ── Buttons / inputs / toolbar ──────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 15px;font-size:13.5px;
  font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;font-family:inherit}
.btn.primary{background:var(--primary);color:var(--primary-fg);box-shadow:0 1px 2px rgba(14,138,102,.4)}
.btn.primary:hover{background:var(--primary-h)}
.btn.ghost{background:var(--card);border-color:var(--border);color:var(--fg)}
.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.on-p{background:rgba(14,138,102,.15);color:var(--primary);border-color:rgba(14,138,102,.35)}
.btn.on-a{background:rgba(214,69,69,.13);color:var(--danger);border-color:rgba(214,69,69,.3)}
.btn.on-l{background:rgba(217,165,20,.15);color:var(--warn);border-color:rgba(217,165,20,.35)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.input,.select{background:var(--card);border:1px solid var(--input);border-radius:10px;color:var(--fg);
  padding:9px 12px;font-size:13.5px;font-family:inherit;outline:none;transition:border .15s,box-shadow .15s}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,138,102,.15)}
.input.search{min-width:230px}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 0;
  font-size:12.5px;color:var(--muted-fg);flex-wrap:wrap;gap:8px}
.pager .btns{display:flex;gap:6px}

/* ── Teacher / class cards ───────────────────────────────────────────────── */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard .hd{display:flex;align-items:center;gap:12px;padding:16px 18px 0}
.tcard .bd{padding:12px 18px 16px;font-size:12.5px;color:var(--muted-fg);display:grid;gap:5px}
.tcard .bd b{color:var(--fg);font-weight:600}
.subj-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.subj-chips .chip{font-size:10.5px;padding:2px 8px}

/* ── Attendance toggles ──────────────────────────────────────────────────── */
.att-btns{display:flex;gap:5px}
.att-btns .btn{padding:4px 11px;font-size:12px}

/* ── Timetable ───────────────────────────────────────────────────────────── */
.tt-cell{background:hsla(var(--sh),45%,50%,.07);border:1px solid var(--border);border-radius:10px;padding:8px 9px;min-height:58px;
  display:flex;flex-direction:column;gap:2px;transition:transform .15s,border-color .15s}
.tt-cell:hover{transform:translateY(-1px);border-color:rgba(14,138,102,.45)}
.tt-cell b{font-size:12.5px;color:hsl(var(--sh),52%,32%)}
html.dark .tt-cell{background:hsla(var(--sh),45%,50%,.13)}
html.dark .tt-cell b{color:hsl(var(--sh),55%,68%)}
.tt-cell span{font-size:10.5px;color:var(--muted-fg)}
.tt-grid{display:grid;grid-template-columns:76px repeat(6,1fr);gap:7px}
.tt-head{font-size:11px;font-weight:700;color:var(--muted-fg);text-transform:uppercase;
  letter-spacing:.05em;padding:2px 4px}
.tt-time{font-size:11px;color:var(--muted-fg);display:flex;align-items:center;flex-wrap:wrap}

/* ── Notices / expenses / settings ───────────────────────────────────────── */
.notice{display:flex;gap:13px;padding:15px 18px;border-bottom:1px solid var(--border)}
.notice:last-child{border-bottom:none}
.notice .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;
  background:var(--accent);color:var(--primary)}
.notice h4{margin:0 0 3px;font-size:13.5px}
.notice p{margin:0;font-size:12.5px;color:var(--muted-fg)}
.notice .when{font-size:11px;color:var(--muted-fg);white-space:nowrap;margin-left:auto}
.profile-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.profile-row:last-child{border-bottom:none}
.profile-row .k{color:var(--muted-fg)}

/* ── Modal & toast ───────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:90;background:rgba(13,26,21,.5);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:18px}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);
  width:100%;max-width:460px;animation:viewEnter .25s cubic-bezier(.22,1,.36,1) both}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
  border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
.modal .mb{padding:18px 20px;display:grid;gap:12px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
.field label{display:block;font-size:12px;font-weight:650;color:var(--muted-fg);margin-bottom:5px}
.field .input,.field .select{width:100%}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);
  border-radius:11px;box-shadow:var(--shadow-lg);padding:12px 16px;min-width:250px;max-width:340px;
  font-size:13px;animation:toastIn .3s cubic-bezier(.22,1,.36,1) both}
.toast b{display:block;font-size:13px}
.toast span{color:var(--muted-fg);font-size:12px}
.toast.err{border-left-color:var(--danger)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.empty{padding:44px 20px;text-align:center;color:var(--muted-fg);font-size:13.5px}
.mono{font-variant-numeric:tabular-nums}
.r{ text-align:right}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media(max-width:1024px){.stat-grid{grid-template-columns:1fr 1fr}.grid-2,.grid-3-2{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
  aside.sidebar{transform:translateX(-100%)}
  aside.sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(13,26,21,.45)}
  main{margin-left:0}
  .hamburger{display:grid}
  .chip-date{display:none}
  #view{padding:14px}
  .hero{padding:20px}
}
@media(max-width:560px){.stat-grid{grid-template-columns:1fr}.card-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="mark" id="logo-mark"></div>
      <div><b>SkoolyPro</b><span id="sb-school">Iqra Model School</span></div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">HTML Edition — static demo<br/>Data resets on refresh</div>
  </aside>
  <main>
    <div class="topbar">
      <button class="icon-btn hamburger" id="btn-menu" title="Menu"></button>
      <div><h1 id="pg-title">Dashboard</h1><div class="sub" id="pg-sub">School overview</div></div>
      <div class="spacer"></div>
      <div class="chip-date" id="today-chip"></div>
      <button class="icon-btn" id="btn-theme" title="Toggle dark mode"></button>
      <div class="me-badge">IM</div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<script>
"use strict";
// ── Icons (inline SVG, lucide-style) ───────────────────────────────────────
const ICONS={
  cap:'<path d="M2 9.5 12 4.5l10 5-10 5z"/><path d="M6.5 11.8V16c0 1.6 2.5 3 5.5 3s5.5-1.4 5.5-3v-4.2"/><path d="M22 9.5V15"/>',
  dashboard:'<rect x="3" y="3" width="7.5" height="9.5" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="1.8"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="1.8"/><rect x="3" y="15.5" width="7.5" height="5.5" rx="1.8"/>',
  students:'<circle cx="9" cy="8" r="3.4"/><path d="M2.6 20a6.6 6.6 0 0 1 12.8 0"/><path d="M16.5 4.6a3.4 3.4 0 0 1 0 6.6"/><path d="M17.8 14.2c2.2.9 3.6 2.7 3.6 5.2"/>',
  teachers:'<circle cx="12" cy="8" r="3.8"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>',

function buildTimetable(classes,teachers){
  const slots=[];
  classes.forEach(c=>{
    DAYS.forEach((d,di)=>{
      PERIODS.forEach((p,pi)=>{
        const subject=c.subjects[(di+pi)%c.subjects.length];
        const t=teachers.find(t=>t.subject===subject)||teachers.find(t=>t.id===c.classTeacherId);
        slots.push({classId:c.id,day:d,period:pi+1,time:p,subject,teacherId:t.id});
      });
    });
  });
  return slots;
}

    stat("Fees Collected (Oct)",rs(octPaid),'<b>'+Math.round(octPaid/feeM[5].c*100||0)+'%</b> of October target',"wallet")+
    stat("Attendance Today",todayPct+"%",presentLate(todayRows)+" present &amp; late","attendance")+

    '<div class="card-b"><svg viewBox="0 0 560 205" style="width:100%;color:var(--fg)" role="img" aria-label="Attendance trend"><defs>'+
    '<linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e8a66" stop-opacity=".26"/><stop offset="1" stop-color="#0e8a66" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#ga)"/><polyline points="'+pts+'" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linecap="round"/>'+dots+'</svg>'+
    '<div style="display:flex;justify-content:space-between;padding:2px 12px 0 34px">'+dayLbl.map(l=>'<span class="bar-lbl">'+l+'</span>').join("")+'</div></div></div>'+

    chip(c.subjects.length+" subjects · max 100 marks","mut")+'</div>';
  if(exam.status!=="Published"){
    return head+'<div class="card"><div class="empty" style="padding:70px 20px">'+
    '<div style="margin-bottom:8px;opacity:.6">'+icon("exams",34)+'</div>'+
    '<b style="color:var(--fg)">'+esc(exam.name)+' — results not published yet</b>'+

    '<div style="margin-top:14px"><button class="btn ghost" id="ex-view1">View First Term 2026</button></div></div></div>';
  }
  const students=DB.students.filter(s=>s.classId===c.id&&s.status==="Active");
  const rows=students.map(s=>{
    const ms=c.subjects.map(sub=>{const mk=DB.marks.find(m=>m.examId===exam.id&&m.studentId===s.id&&m.subject===sub);
      return mk?mk.total:null;});
    const valid=ms.filter(v=>v!=null);
    const avg=valid.length?Math.round(valid.reduce((a,v)=>a+v,0)/valid.length):0;
    const g=gradeOf(avg);
    return '<tr><td><div class="who">'+avatar(s.name)+'<div><div class="nm">'+esc(s.name)+'</div><div class="sub">'+esc(s.rollNo)+'</div></div></div></td>'+
    ms.map(v=>v==null?'<td style="color:var(--muted-fg)">—</td>':
      '<td class="mono" style="font-weight:600;color:'+(v>=80?"var(--primary)":v>=50?"var(--fg)":"var(--danger)")+'">'+v+'</td>').join("")+
    '<td class="mono" style="font-weight:700">'+avg+'%</td><td><span class="grade '+g[1]+'">'+g[0]+'</span></td></tr>';}).join("");
  const clsAvg=Math.round(students.reduce((a,s)=>{
    const ms=c.subjects.map(sub=>{const mk=DB.marks.find(m=>m.examId===exam.id&&m.studentId===s.id&&m.subject===sub);return mk?mk.total:0;});
    return a+ms.reduce((x,v)=>x+v,0)/ms.length;},0)/(students.length||1));
  return head+
  '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">'+
    '<div class="card stat" style="padding:16px 18px"><div class="lbl">Students Graded</div><div class="val mono" style="font-size:20px;margin-top:4px">'+students.length+'</div><div style="margin-top:6px">'+chip("all present","ok")+'</div></div>'+
    '<div class="card stat" style="padding:16px 18px"><div class="lbl">Class Average</div><div class="val mono" style="font-size:20px;margin-top:4px">'+clsAvg+'%</div><div style="margin-top:6px"><span class="grade '+gradeOf(clsAvg)[1]+'">'+gradeOf(clsAvg)[0]+'</span></div></div>'+
    '<div class="card stat" style="padding:16px 18px"><div class="lbl">Top Subject Hint</div><div class="val" style="font-size:15px;margin-top:4px;font-weight:650">First Term 2026</div><div style="margin-top:6px">'+chip("published · viva done","acc")+'</div></div></div>'+
  '<div class="tbl-wrap" style="margin-top:14px"><table class="tbl" style="min-width:'+(300+c.subjects.length*70)+'px"><thead><tr><th>Student</th>'+
  c.subjects.map(s=>'<th>'+esc(s)+'</th>').join("")+'<th>Avg</th><th>Grade</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
};
BINDS.exams=function(){
  $("ex-id").onchange=function(){UI.examId=this.value;renderInto("exams");};
  $("ex-cls").onchange=function(){UI.examClass=this.value;renderInto("exams");};
  const v=$("ex-view1");if(v)v.onclick=()=>{UI.examId="exam-1";renderInto("exams");};
};

// ── Timetable ─────────────────────────────────────────────────────────────
VIEWS.timetable=function(){
  const c=cls(UI.ttClass);
  const slots=DB.timetable.filter(t=>t.classId===c.id);
  const at=(d,p)=>slots.find(s=>s.day===d&&s.period===p);
  let grid='<div class="tt-head" style="display:flex;align-items:center">Time</div>';
  DAYS.forEach(d=>{grid+='<div class="tt-head" style="display:flex;align-items:center">'+d+'</div>';});
  PERIODS.forEach((p,pi)=>{
    grid+='<div class="tt-time">'+p+'</div>';
    DAYS.forEach(d=>{const s=at(d,pi+1);const t=s?tch(s.teacherId):null;
      grid+='<div class="tt-cell" style="--sh:'+subjHue(s?s.subject:"")+'"><b>'+esc(s?s.subject:"—")+'</b>'+
      '<span>'+esc(t?t.name.split(" ")[0]:"")+' · '+esc(t?t.subject:"")+'</span></div>';});
  });
  return '<div class="toolbar"><select id="tt-cls" class="select">'+opts(cOpts(),UI.ttClass)+'</select>'+
    '<span class="chip mut">Room '+esc(c.roomNo)+' · Sections '+c.sections.join(" & ")+'</span>'+
    '<div style="flex:1"></div><span class="chip acc">Class Teacher: '+esc((tch(c.classTeacherId)||{}).name||"—")+'</span></div>'+
    '<div class="card" style="padding:16px"><div class="tt-grid">'+grid+'</div></div>';
};
BINDS.timetable=function(){$("tt-cls").onchange=function(){UI.ttClass=this.value;renderInto("timetable");};};

// ── Notices ───────────────────────────────────────────────────────────────
VIEWS.notices=function(){
  return '<div class="card">'+DB.notices.map(n=>
    '<div class="notice"><div class="ico">'+icon("mega",17)+'</div>'+
    '<div style="flex:1;min-width:0"><h4>'+esc(n.title)+' '+noticeChip(n.type)+'</h4><p>'+esc(n.body)+'</p></div>'+
    '<div class="when">'+fmtD(n.date)+'</div></div>').join("")+'</div>';
};
BINDS.notices=function(){};

// ── Expenses ──────────────────────────────────────────────────────────────
VIEWS.expenses=function(){
  const oct=DB.expenses.filter(e=>e.date.indexOf("2026-10")===0);
  const octTotal=oct.reduce((a,e)=>a+e.amount,0);
  const pend=DB.expenses.filter(e=>e.status==="Pending");
  const cats={};DB.expenses.forEach(e=>{cats[e.category]=(cats[e.category]||0)+e.amount;});
  const cmax=Math.max.apply(null,Object.values(cats));
  const hbars=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).map(k=>
    '<div class="hbar-row"><div class="hbar-name" style="width:80px">'+esc(k)+'</div>'+
    '<div class="hbar-track"><div class="hbar-fill" style="width:'+Math.round(cats[k]/cmax*100)+'%"></div></div>'+
    '<div class="hbar-val" style="width:auto;font-size:10.5px;color:var(--muted-fg)">'+rs(cats[k])+'</div></div>').join("");
  const rows=DB.expenses.map(e=>'<tr><td class="mono" style="color:var(--muted-fg)">'+fmtD(e.date)+'</td>'+
    '<td>'+chip(e.category,"acc")+'</td><td>'+esc(e.description)+'</td>'+
    '<td class="mono r" style="font-weight:600">'+rs(e.amount)+'</td>'+
    '<td>'+(e.status==="Paid"?chip("Paid","ok"):chip("Pending","warn"))+'</td></tr>').join("");
  return '<div class="grid-3-2">'+
    '<div class="stat-grid" style="grid-template-columns:1fr 1fr;align-content:start">'+
    '<div class="card stat" style="padding:16px 18px"><div class="lbl">October Spend</div><div class="val mono" style="font-size:20px;margin-top:4px">'+rs(octTotal)+'</div><div style="margin-top:6px">'+chip(oct.length+" vouchers","mut")+'</div></div>'+
    '<div class="card stat" style="padding:16px 18px"><div class="lbl">Pending Payments</div><div class="val mono" style="font-size:20px;margin-top:4px">'+rs(pend.reduce((a,e)=>a+e.amount,0))+'</div><div style="margin-top:6px">'+chip(pend.length+" vouchers awaiting","warn")+'</div></div>'+
    '<div class="card" style="grid-column:1/-1"><div class="card-h">Spend by Category</div><div class="card-b" style="padding-top:16px">'+hbars+'</div></div></div>'+
    '<div class="card"><div class="card-h">Budget Health</div><div class="card-sub">Fees collected vs expenses — October 2026</div><div class="card-b">'+
    (()=>{const octPaid=DB.fees.filter(f=>f.month==="2026-10"&&f.status==="Paid").reduce((a,f)=>a+f.amount,0);
      const pct=Math.min(100,Math.round(octPaid/octTotal*100));
      return '<div class="hbar-row"><div class="hbar-name" style="width:52px">Fees</div><div class="hbar-track"><div class="hbar-fill" style="width:100%"></div></div><div class="hbar-val" style="width:auto;font-size:10.5px">'+rs(octPaid)+'</div></div>'+
      '<div class="hbar-row"><div class="hbar-name" style="width:52px">Spend</div><div class="hbar-track"><div class="hbar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,#eec25c,#d9a514)"></div></div><div class="hbar-val" style="width:auto;font-size:10.5px">'+rs(octTotal)+'</div></div>'+
      '<p style="font-size:12.5px;color:var(--muted-fg);margin:12px 0 0">October fee collection covers <b style="color:var(--primary)">'+pct+'%</b> of monthly spending. Salaries remain the largest cost, followed by utilities and transport.</p>';})()+
    '</div></div></div>'+
    '<div class="tbl-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="r">Amount</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
};
BINDS.expenses=function(){};

// ── Settings ──────────────────────────────────────────────────────────────
VIEWS.settings=function(){
  const pRow=(k,v)=>'<div class="profile-row"><span class="k">'+k+'</span><span style="font-weight:600">'+v+'</span></div>';
  return '<div class="grid-2">'+
    '<div class="card"><div class="card-h">School Profile</div><div class="card-sub">Shown on fee challans, report cards and notices</div>'+
    '<div class="card-b">'+pRow("School Name",esc(SCHOOL.name))+pRow("Tagline",esc(SCHOOL.tagline))+
    pRow("Address",esc(SCHOOL.address))+pRow("Phone",esc(SCHOOL.phone))+pRow("Email",esc(SCHOOL.email))+
    pRow("Session",esc(SCHOOL.session))+pRow("Principal",esc(SCHOOL.principal))+
    pRow("Classes","Class 1 – Class 10")+pRow("Teaching Staff",DB.teachers.length+" members")+'</div></div>'+
    '<div class="card"><div class="card-h">About this HTML Edition</div><div class="card-sub">Standalone single-file demo</div>'+
    '<div class="card-b" style="display:grid;gap:12px;font-size:13.5px">'+
    '<p style="margin:0;color:var(--muted-fg)">This file is a <b style="color:var(--fg)">static HTML edition</b> of SkoolyPro. Everything — styles, data and logic — lives inside this one file, so it works offline: just double-click it. No server, no database, no installation.</p>'+
    '<p style="margin:0;color:var(--muted-fg)">Your full Next.js edition adds a REST API and an SQLite database, so changes there are <b style="color:var(--fg)">permanently saved</b>. In this HTML file, edits like admissions, attendance and fee collection live in memory and reset when you refresh the page.</p>'+
    '<div style="display:flex;gap:9px;flex-wrap:wrap">'+chip("No internet needed","ok")+chip("Open in any browser","ok")+chip("Demo data resets on refresh","warn")+'</div>'+
    '<div style="margin-top:4px"><button id="btn-reset" class="btn ghost">Reset Demo Data</button></div></div></div></div>';
};
BINDS.settings=function(){
  $("btn-reset").onclick=()=>{DB=buildDB();
    for(const k in ATT)delete ATT[k];
    DB.attendance.filter(a=>a.date===TODAY).forEach(a=>{ATT[a.studentId]=a.status;});
    toast("Demo data reset","All records restored to original seeded values");route();};
};

// ── Boot ──────────────────────────────────────────────────────────────────
route();
</script>
</body>
</html>
